<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Do You Love Me?</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins', sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#ff9ecf,#ffd6ec,#fff0f7);
      overflow:hidden;
    }

    .container{
      text-align:center;
      background:rgba(255,255,255,0.25);
      padding:40px;
      border-radius:25px;
      backdrop-filter:blur(10px);
      box-shadow:0 8px 25px rgba(0,0,0,0.15);
      animation:fadeIn 1s ease;
    }

    h1{
      font-size:3rem;
      color:#ff2e74;
      margin-bottom:30px;
      text-shadow:2px 2px 10px rgba(255,255,255,0.7);
    }

    .buttons{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:20px;
      flex-wrap:wrap;
    }

    button{
      border:none;
      padding:15px 35px;
      font-size:1.5rem;
      border-radius:15px;
      cursor:pointer;
      transition:0.3s;
      color:white;
      font-weight:bold;
    }

    #yesBtn{
      background:#2ecc71;
      box-shadow:0 5px 15px rgba(46,204,113,0.4);
    }

    #noBtn{
      background:#e74c3c;
      box-shadow:0 5px 15px rgba(231,76,60,0.4);
    }

    #yesBtn:hover{
      transform:scale(1.1);
    }

    #message{
      margin-top:25px;
      font-size:2rem;
      color:#ff2e74;
      font-weight:bold;
      opacity:0;
      transition:0.5s;
    }

    .heart{
      position:absolute;
      color:pink;
      font-size:20px;
      animation:float 5s linear infinite;
      opacity:0.7;
    }

    @keyframes float{
      0%{
        transform:translateY(100vh) scale(1);
        opacity:0;
      }
      50%{
        opacity:1;
      }
      100%{
        transform:translateY(-10vh) scale(1.5);
        opacity:0;
      }
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(30px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Do You Love Me? 💖</h1>

    <div class="buttons">
      <button id="yesBtn">Yes</button>
      <button id="noBtn">No</button>
    </div>

    <div id="message">I knew it 😍💖</div>
  </div>

  <script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const message = document.getElementById("message");

    let yesSize = 1.5;

    noBtn.addEventListener("click", () => {
      yesSize += 0.8;

      yesBtn.style.fontSize = yesSize + "rem";
      yesBtn.style.padding = `${yesSize * 10}px ${yesSize * 20}px`;

      // membuat tombol no makin kecil
      noBtn.style.transform = "scale(0.8)";

      // sembunyikan tombol no jika yes sudah sangat besar
      if (yesSize > 5) {
        noBtn.style.display = "none";
      }
    });

    yesBtn.addEventListener("click", () => {
      message.style.opacity = "1";
      createHearts();
    });

    function createHearts(){
      for(let i = 0; i < 30; i++){
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "💖";

        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = (Math.random() * 3 + 2) + "s";
        heart.style.fontSize = (Math.random() * 20 + 20) + "px";

        document.body.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 5000);
      }
    }
  </script>

</body>
</html>
